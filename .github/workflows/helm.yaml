name: Release Charts

on:
  release:
    types: [published]

# Least-privilege default; the release job below grants itself only what
# it actually needs.
permissions: {}

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: "3.17.0"

      - name: Add mariadb-operator repo
        run: helm repo add mariadb-operator https://mariadb-operator.github.io/mariadb-operator

      - name: Add redis-operator repo
        run: helm repo add redis-operator https://ot-container-kit.github.io/helm-charts/

      - name: Build chart dependencies
        run: helm dependency build charts/bebot

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@a0d2dc62c5e491af8ef6ba64a2e02bcf3fb33aa1 # v1.7.0
        with:
          pages_branch: gh-pages
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy README to gh-pages
        run: cp README.md gh-pages/README.md

      - name: Commit and push README
        working-directory: gh-pages
        run: |
          git add README.md
          git diff --cached --quiet && echo "README unchanged, skipping commit" && exit 0
          git commit -m "docs: update README from main"
          git push
