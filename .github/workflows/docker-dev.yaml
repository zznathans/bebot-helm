name: Docker (dev)

# Floating dev image build. Every push to a non-main branch rebuilds and
# pushes ghcr.io/zznathans/bebot-helm:dev, overwriting whatever was there -
# the bebot-test k8s deployment tracks this same "dev" tag with
# imagePullPolicy: Always, so `kubectl rollout restart` there always picks
# up the latest push. Unlike docker.yaml, this never touches a real semver
# release tag.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to build (submodules are checked out as pinned on this ref)"
        required: false
        default: ""

jobs:
  build-bebot-dev-image:
    name: Build and Push (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: charts/bebot
          push: true
          # Single-platform only - this is a throwaway dev image, not a
          # release artifact, so skip the amd64+arm64 matrix to keep it fast.
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
