name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: charts/bebot/tools/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r charts/bebot/tools/requirements-dev.txt

      - name: Run pylint
        run: pylint charts/bebot/tools/generate-gcp-secret.py --fail-under=8.0

      - name: Run pytest
        run: pytest charts/bebot/tools/tests/ -v

  yamllint:
    name: Yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint -c .yamllint.yaml .

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "3.17.0"

      - name: Add redis-operator repo
        run: helm repo add redis-operator https://ot-container-kit.github.io/helm-charts/

      - name: Build chart dependencies
        run: helm dependency build charts/bebot

      - name: Run helm lint
        run: helm lint charts/bebot --strict

  helm-unittest:
    name: Helm Unit Tests
    needs: [helm-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "3.17.0"

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.6.2

      - name: Add redis-operator repo
        run: helm repo add redis-operator https://ot-container-kit.github.io/helm-charts/

      - name: Build chart dependencies
        run: helm dependency build charts/bebot

      - name: Run helm unit tests
        run: helm unittest charts/bebot

