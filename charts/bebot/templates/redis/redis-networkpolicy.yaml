{{- if .Values.bebot.redis.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-redis
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.bebot.instances }}
        - podSelector:
            matchLabels:
              app: {{ $.Release.Name }}-{{ .name }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 6379
    {{- if .Values.bebot.redis.metrics.enabled }}
    - ports:
        - protocol: TCP
          port: 9121
    {{- end }}
{{- end }}
