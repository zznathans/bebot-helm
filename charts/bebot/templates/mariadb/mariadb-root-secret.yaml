{{- if and .Values.bebot.mariadb.enabled (ne .Values.bebot.mariadb.createSecret false) }}
{{- $secretName := printf "%s-mariadb-root" .Release.Name }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $rootPassword := "" }}
{{- if and $existingSecret $existingSecret.data (index $existingSecret.data "root-password") }}
{{- $rootPassword = index $existingSecret.data "root-password" | b64dec }}
{{- else }}
{{- $rootPassword = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  root-password: {{ $rootPassword | quote }}
  # The mariadb-operator's MariaDB CR only ever authenticates its root user as literally "root"
  # (there is no root-username override on the CR) - hardcode this instead of honoring
  # bebot.mariadb.rootUser, so a non-default value can't silently produce a root secret whose
  # root-user key doesn't match the actual database user (breaking test-mariadb-ping.yaml and
  # anything else that reads this key expecting it to be authoritative).
  root-user: "root"
{{- end }}
