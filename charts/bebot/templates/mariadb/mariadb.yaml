{{- if .Values.bebot.mariadb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-mariadb
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/instance: {{ .Release.Name }}-mariadb
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: {{ .Release.Name }}-mariadb
  # Deliberately fixed: this chart only offers a single pod with a PVC. Anything fancier
  # (replication, backups, ...) should be run separately and referenced via mariadbHost.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb
      app.kubernetes.io/instance: {{ .Release.Name }}-mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/instance: {{ .Release.Name }}-mariadb
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: mariadb
          image: {{ .Values.bebot.mariadb.image }}
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          env:
            - name: MARIADB_ROOT_HOST
              value: "%"
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-mariadb-root
                  key: root-password
            # Run mariadb-upgrade automatically after an image version bump.
            - name: MARIADB_AUTO_UPGRADE
              value: "1"
          # These use the root password rather than the image's healthcheck.sh, which needs a
          # healthcheck user that only exists on data directories the image initialized itself.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - MYSQL_PWD="${MARIADB_ROOT_PASSWORD}" mariadb-admin --skip-ssl -h127.0.0.1 -uroot ping
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - MYSQL_PWD="${MARIADB_ROOT_PASSWORD}" mariadb-admin --skip-ssl -h127.0.0.1 -uroot ping
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - MYSQL_PWD="${MARIADB_ROOT_PASSWORD}" mariadb --skip-ssl -h127.0.0.1 -uroot -e "SELECT 1"
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.bebot.mariadb.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.bebot.mariadb.persistence.storageClass }}
        storageClassName: {{ .Values.bebot.mariadb.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.bebot.mariadb.persistence.size | default "1Gi" }}
{{- end }}
