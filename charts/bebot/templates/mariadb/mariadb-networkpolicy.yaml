{{- if .Values.bebot.mariadb.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-mariadb
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}-mariadb
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.bebot.instances }}
        - podSelector:
            matchLabels:
              app: {{ $.Release.Name }}-{{ .name }}
        {{- end }}
        {{- if or .Values.bebot.mariadb.backup.enabled .Values.bebot.mariadb.restore.enabled .Values.bebot.mariadb.bootstrapFrom.enabled }}
        {{/*
        mariadb-operator doesn't document stable pod labels for the Backup/Restore Job pods it
        creates, so rather than guess a selector that could silently break backups/restores,
        allow ingress from any pod in this namespace when any of these operator-driven jobs are
        in play (NetworkPolicy ingress `from` with no namespaceSelector already scopes this to
        the release's own namespace).
        */}}
        - podSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: 3306
    {{- if .Values.bebot.mariadb.metrics.enabled }}
    - ports:
        - protocol: TCP
          port: 9104
    {{- end }}
{{- end }}
