{{- if and .Values.bebot.mariadb.enabled .Values.bebot.mariadb.backup.enabled }}
{{- $destination := .Values.bebot.mariadb.backup.destination | default "pvc" }}
{{- if not (has $destination (list "pvc" "s3")) }}
  {{- fail (printf "bebot.mariadb.backup.destination must be \"pvc\" or \"s3\", got %q" $destination) }}
{{- end }}
{{/*
The Backup CRD's spec.storage.s3.bucket/endpoint are plain required strings with no
secretKeyRef (only the access/secret keys below support that), and unlike a CronJob's env
vars, a Helm `lookup` at these values can't be relied on either - ArgoCD (and other
server-side-apply/diff tooling) renders manifests for diffing without live cluster access,
so `lookup` silently returns nothing there even though it may work when applied directly via
`helm upgrade`. So bucket/endpoint/region must always come from plain values, regardless of
s3.externalSecret.enabled - only the credentials themselves can be secret-sourced.
*/}}
{{- if eq $destination "s3" }}
  {{- if not .Values.bebot.mariadb.backup.s3.bucket }}
    {{- fail "bebot.mariadb.backup.s3.bucket is required when destination is \"s3\" (the operator's Backup CRD has no way to source it from a Secret)" }}
  {{- end }}
  {{- if and (not .Values.bebot.mariadb.backup.s3.credentialsSecret) (not .Values.bebot.mariadb.backup.s3.externalSecret.enabled) }}
    {{- fail "bebot.mariadb.backup.s3.credentialsSecret is required when destination is \"s3\" and externalSecret.enabled is false" }}
  {{- end }}
{{- end }}
{{- $s3CredentialsSecret := .Values.bebot.mariadb.backup.s3.credentialsSecret | default (printf "%s-mariadb-backup-s3-creds" .Release.Name) }}
{{- $s3Endpoint := .Values.bebot.mariadb.backup.s3.endpoint }}
{{- if and (eq $destination "s3") (not $s3Endpoint) }}
{{- $s3Endpoint = printf "s3.%s.amazonaws.com" (.Values.bebot.mariadb.backup.s3.region | default "us-east-1") }}
{{- end }}
{{- /* The CRD wants a bare host - strip a scheme if the value included one. */}}
{{- $s3Endpoint = $s3Endpoint | trimPrefix "https://" | trimPrefix "http://" }}
apiVersion: k8s.mariadb.com/v1alpha1
kind: Backup
metadata:
  name: {{ .Release.Name }}-mariadb-backup
  namespace: {{ .Release.Namespace }}
  annotations:
    # Deliberately after the per-instance Database/User/Grant CRs (wave "2"), not alongside
    # the MariaDB CR itself. ArgoCD's sync-wave gate requires every resource in a wave to be
    # Healthy before the next wave applies, and this CRD's health check only turns Healthy once
    # an actual backup run completes - a transient S3/credentials misconfiguration (or the
    # first scheduled run just hasn't fired yet) would otherwise block bot database/user/grant
    # provisioning, which has no real dependency on backups ever succeeding.
    argocd.argoproj.io/sync-wave: "3"
spec:
  mariaDbRef:
    name: {{ .Release.Name }}-mariadb
  schedule:
    cron: "{{ .Values.bebot.mariadb.backup.schedule }}"
  maxRetention: {{ .Values.bebot.mariadb.backup.maxRetention | default "720h" }}
  storage:
    {{- if eq $destination "s3" }}
    s3:
      bucket: {{ .Values.bebot.mariadb.backup.s3.bucket | quote }}
      prefix: {{ .Values.bebot.mariadb.backup.s3.path | default "backups/bebot" | quote }}
      region: {{ .Values.bebot.mariadb.backup.s3.region | default "us-east-1" | quote }}
      endpoint: {{ $s3Endpoint | quote }}
      tls:
        enabled: {{ .Values.bebot.mariadb.backup.s3.tls }}
      accessKeyIdSecretKeyRef:
        name: {{ $s3CredentialsSecret }}
        key: access-key-id
      secretAccessKeySecretKeyRef:
        name: {{ $s3CredentialsSecret }}
        key: secret-access-key
    {{- else }}
    persistentVolumeClaim:
      resources:
        requests:
          storage: {{ .Values.bebot.mariadb.backup.pvc.size | default "5Gi" }}
      accessModes:
        - {{ .Values.bebot.mariadb.backup.pvc.accessMode | default "ReadWriteOnce" }}
      {{- if .Values.bebot.mariadb.backup.pvc.storageClass }}
      storageClassName: {{ .Values.bebot.mariadb.backup.pvc.storageClass }}
      {{- end }}
    {{- end }}
{{- end }}
