{{- range .Values.bebot.instances }}
{{- if ne .createSecret false }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-conf-{{ .name }}
  namespace: {{ $.Release.Namespace }}
type: Opaque
stringData:
  Mysql.conf: |-
{{ tpl ( $.Files.Get "files/Mysql.conf.dist" ) (dict
      "raidbot" .raidbot
      "mariadbUser" (.mariadbUser | default "")
      "mariadbPassword" (.mariadbPassword | default "")
      "mariadbDatabase" (.mariadbDatabase | default "")
      "mariadbHost" (default (printf "%s-mariadb" $.Release.Name) .mariadbHost)
      "mariadbPort" .mariadbPort
      "mariadbSsl" .mariadbSsl
      "mariadbSslCa" (.mariadbSslCa | default "")
    ) | indent 4 }}
  Bot.conf: |-
{{ tpl ( $.Files.Get "files/Bot.conf.dist" ) (dict
      "ao_username" .ao_username
      "ao_password" (.ao_password | default "")
      "bot_name" .bot_name
      "dimension" .dimension
      "guild" (.guild | default "")
      "botOwner" .botOwner
      "superAdmins" .superAdmins
      "slave" (.slave | default "")
      "periph" (.periph | default 0)
      "otherBots" .otherBots
      "raidbot" .raidbot
      "guildId" .guildId
      "log" (.log | default "chat")
      "logPath" (.logPath | default "./log")
      "logTimestamp" (.logTimestamp | default "none")
      "logConsoleFormat" (.logConsoleFormat | default "plain")
      "logFileFormat" (.logFileFormat | default "plain")
      "logSecurityFormat" (.logSecurityFormat | default "plain")
      "coreDirectories" (.coreDirectories | default "")
      "moduleDirectories" (.moduleDirectories | default "")
      "commandPrefix" (.commandPrefix | default "!")
      "cronDelay" (.cronDelay | default 30)
      "tellDelay" (.tellDelay | default 2222)
      "reconnectTime" (.reconnectTime | default 60)
      "accessAllBots" .accessAllBots
      "useProxyServer" .useProxyServer
      "proxyServerAddress" (.proxyServerAddress | default "")
    ) | indent 4 }}
  mariadb_user: {{ .mariadbUser | default "" | quote }}
  mariadb_password: {{ .mariadbPassword | default "" | quote }}
  mariadb_database: {{ .mariadbDatabase | default "" | quote }}
  Aoaccounts.conf: |-
{{ $.Files.Get "files/Aoaccount.ini" | indent 4 }}
  ServerList.php: |-
{{ $.Files.Get "files/ServerList.php" | indent 4 }}
---
{{- end }}
{{- end }}
