{{- range .Values.bebot.instances }}
{{- if ne .enabled false }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $.Release.Name }}-{{ .name }}
  template:
    metadata:
      annotations:
        checksum/conf: {{ toYaml . | sha256sum }}
      labels:
        app: {{ $.Release.Name }}-{{ .name }}
    spec:
      serviceAccount: {{ $.Release.Name }}-serviceaccount-{{ .name }}
      initContainers:
        - name: copy-configs
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - cp /secret/* /conf/
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: bebot-conf-empty
              mountPath: /conf
            - name: bebot-conf-secret
              mountPath: /secret
              readOnly: true
      terminationGracePeriodSeconds: {{ $.Values.bebot.terminationGracePeriodSeconds | default 60 }}
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: {{ $.Release.Name }}
          image: {{ $.Values.bebot.imageRepository }}:{{ $.Values.bebot.imageTag }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 2"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $.Values.bebot.resources | nindent 12 }}
          volumeMounts:
            - name: bebot-conf-empty
              mountPath: /BeBot/Conf
      volumes:
        - name: bebot-conf-empty
          emptyDir: {}
        - name: bebot-conf-secret
          secret:
            secretName: {{ $.Release.Name }}-conf-{{ .name }}
            items:
              - key: Mysql.conf
                path: Mysql.conf
              - key: Bot.conf
                path: Bot.conf
              - key: Aoaccounts.conf
                path: Aoaccounts.conf
              - key: ServerList.php
                path: ServerList.php
---
{{- end }}
{{- end }}
