{{- if .Values.bebot.mariadb.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-mariadb-ping
  namespace: {{ .Release.Namespace }}
  labels:
    {{ .Release.Name }}-mariadb-client: "true"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: mariadb-ping
      image: {{ .Values.bebot.mariadb.image }}
      command:
        - /bin/sh
        - -c
        - MYSQL_PWD="${ROOT_PASSWORD}" mariadb --skip-ssl -uroot -h{{ .Release.Name }}-mariadb -e "SELECT 1"
      env:
        - name: ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-mariadb-root
              key: root-password
{{- end }}
