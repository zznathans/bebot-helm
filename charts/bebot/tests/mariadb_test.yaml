suite: mariadb statefulset
templates:
  - mariadb/mariadb.yaml
tests:
  - it: renders a single-replica StatefulSet by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mariadb
      - equal:
          path: spec.replicas
          value: 1

  - it: renders nothing when mariadb is disabled
    set:
      bebot.mariadb.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: uses the configured mariadb image
    set:
      bebot.mariadb.image: mariadb:10.11
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: mariadb:10.11

  - it: takes the root password from the root secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MARIADB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-mariadb-root
                key: root-password

  - it: mounts a PVC sized from values at the data directory
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: storage
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 1Gi
      - notExists:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: storage
            mountPath: /var/lib/mysql

  - it: uses the configured PVC size and storageClass
    set:
      bebot.mariadb.persistence.size: 5Gi
      bebot.mariadb.persistence.storageClass: fast
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 5Gi
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: fast

  - it: uses the configured resources
    set:
      bebot.mariadb.resources:
        limits:
          memory: 1Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi
