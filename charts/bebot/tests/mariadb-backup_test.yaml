suite: mariadb backup
templates:
  - mariadb/mariadb-backup.yaml
tests:
  - it: renders nothing when backup is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when mariadb is disabled
    set:
      bebot.mariadb.enabled: false
      bebot.mariadb.backup.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a Backup CR with a PVC destination by default
    set:
      bebot.mariadb.backup.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Backup
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mariadb-backup
      # Deliberately after the Database/User/Grant CRs (sync-wave "2") so a stuck/unhealthy
      # Backup can never block bot provisioning - see the comment in the template.
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "3"
      - equal:
          path: spec.mariaDbRef.name
          value: RELEASE-NAME-mariadb
      - isNotEmpty:
          path: spec.storage.persistentVolumeClaim
      - notExists:
          path: spec.storage.s3

  - it: uses the configured backup schedule and retention
    set:
      bebot.mariadb.backup.enabled: true
      bebot.mariadb.backup.schedule: "0 3 * * 0"
      bebot.mariadb.backup.maxRetention: "168h"
    asserts:
      - equal:
          path: spec.schedule.cron
          value: "0 3 * * 0"
      - equal:
          path: spec.maxRetention
          value: 168h

  - it: uses the configured PVC size and access mode
    set:
      bebot.mariadb.backup.enabled: true
      bebot.mariadb.backup.pvc.size: 10Gi
    asserts:
      - equal:
          path: spec.storage.persistentVolumeClaim.resources.requests.storage
          value: 10Gi

  - it: renders S3 storage when destination is s3
    set:
      bebot.mariadb.backup.enabled: true
      bebot.mariadb.backup.destination: s3
      bebot.mariadb.backup.s3.bucket: my-bucket
      bebot.mariadb.backup.s3.credentialsSecret: my-s3-secret
    asserts:
      - isNotEmpty:
          path: spec.storage.s3
      - notExists:
          path: spec.storage.persistentVolumeClaim
      - equal:
          path: spec.storage.s3.bucket
          value: my-bucket
      # The CRD requires spec.storage.s3.endpoint - it must always render, even with no
      # custom endpoint configured, or the operator rejects the whole Backup CR.
      - equal:
          path: spec.storage.s3.endpoint
          value: s3.us-east-1.amazonaws.com
      - equal:
          path: spec.storage.s3.accessKeyIdSecretKeyRef.name
          value: my-s3-secret
      # TLS defaults on - most providers (including Cloudflare R2) reject plain HTTP with a redirect.
      - equal:
          path: spec.storage.s3.tls.enabled
          value: true

  - it: allows disabling S3 TLS
    set:
      bebot.mariadb.backup.enabled: true
      bebot.mariadb.backup.destination: s3
      bebot.mariadb.backup.s3.bucket: my-bucket
      bebot.mariadb.backup.s3.credentialsSecret: my-s3-secret
      bebot.mariadb.backup.s3.tls: false
    asserts:
      - equal:
          path: spec.storage.s3.tls.enabled
          value: false

  - it: defaults the S3 endpoint using the configured region
    set:
      bebot.mariadb.backup.enabled: true
      bebot.mariadb.backup.destination: s3
      bebot.mariadb.backup.s3.bucket: my-bucket
      bebot.mariadb.backup.s3.credentialsSecret: my-s3-secret
      bebot.mariadb.backup.s3.region: eu-west-1
    asserts:
      - equal:
          path: spec.storage.s3.endpoint
          value: s3.eu-west-1.amazonaws.com

  - it: strips a scheme from an explicit S3 endpoint
    set:
      bebot.mariadb.backup.enabled: true
      bebot.mariadb.backup.destination: s3
      bebot.mariadb.backup.s3.bucket: my-bucket
      bebot.mariadb.backup.s3.credentialsSecret: my-s3-secret
      bebot.mariadb.backup.s3.endpoint: "https://minio.example.com"
    asserts:
      - equal:
          path: spec.storage.s3.endpoint
          value: minio.example.com

  - it: fails when destination is s3 but bucket is empty
    set:
      bebot.mariadb.backup.enabled: true
      bebot.mariadb.backup.destination: s3
      bebot.mariadb.backup.s3.credentialsSecret: my-s3-secret
    asserts:
      - failedTemplate:
          errorMessage: 'bebot.mariadb.backup.s3.bucket is required when destination is "s3" (the operator''s Backup CRD has no way to source it from a Secret)'

  - it: fails when destination is s3 but bucket is empty even with externalSecret enabled
    set:
      bebot.mariadb.backup.enabled: true
      bebot.mariadb.backup.destination: s3
      bebot.mariadb.backup.s3.externalSecret.enabled: true
      bebot.mariadb.backup.s3.externalSecret.secretName: my-s3-secret
    asserts:
      - failedTemplate:
          errorMessage: 'bebot.mariadb.backup.s3.bucket is required when destination is "s3" (the operator''s Backup CRD has no way to source it from a Secret)'

  - it: fails when destination is s3 but credentialsSecret is empty and externalSecret is disabled
    set:
      bebot.mariadb.backup.enabled: true
      bebot.mariadb.backup.destination: s3
      bebot.mariadb.backup.s3.bucket: my-bucket
    asserts:
      - failedTemplate:
          errorMessage: 'bebot.mariadb.backup.s3.credentialsSecret is required when destination is "s3" and externalSecret.enabled is false'

  - it: does not fail when destination is s3, bucket/endpoint set, and externalSecret is enabled (only credentials sourced from it)
    set:
      bebot.mariadb.backup.enabled: true
      bebot.mariadb.backup.destination: s3
      bebot.mariadb.backup.s3.bucket: my-bucket
      bebot.mariadb.backup.s3.endpoint: my-endpoint.example.com
      bebot.mariadb.backup.s3.externalSecret.enabled: true
      bebot.mariadb.backup.s3.externalSecret.secretName: my-s3-secret
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.storage.s3.bucket
          value: my-bucket
      - equal:
          path: spec.storage.s3.endpoint
          value: my-endpoint.example.com

  - it: fails when destination is an invalid value
    set:
      bebot.mariadb.backup.enabled: true
      bebot.mariadb.backup.destination: nfs
    asserts:
      - failedTemplate:
          errorMessage: 'bebot.mariadb.backup.destination must be "pvc" or "s3", got "nfs"'
