suite: mariadb service
templates:
  - mariadb/mariadb-service.yaml
tests:
  - it: exposes the StatefulSet's pod under the host bots connect to by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mariadb
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: mariadb
            app.kubernetes.io/instance: RELEASE-NAME-mariadb

  - it: renders nothing when mariadb is disabled
    set:
      bebot.mariadb.enabled: false
    asserts:
      - hasDocuments:
          count: 0
