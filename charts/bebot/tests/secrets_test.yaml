suite: baked secrets
templates:
  - bebot/bot-conf-secret.yaml
  - mariadb/mariadb-root-secret.yaml
tests:
  - it: renders a bot config Secret for the default instance
    template: bebot/bot-conf-secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-conf-mybot

  - it: does not render bot config Secret when createSecret is false
    template: bebot/bot-conf-secret.yaml
    set:
      bebot.instances:
        - name: mybot
          enabled: true
          guildId: 0
          mariadbUser: botuser
          mariadbDatabase: botdb
          ao_username: ao_account
          bot_name: BotCharacter
          dimension: "5"
          raidbot: false
          botOwner: OwnerCharacter
          superAdmins: []
          createSecret: false
    asserts:
      - hasDocuments:
          count: 0

  - it: Mysql.conf defaults $server to the shared in-cluster MariaDB when mariadbHost is unset
    template: bebot/bot-conf-secret.yaml
    asserts:
      - matchRegex:
          path: stringData["Mysql.conf"]
          pattern: '\$server = "RELEASE-NAME-mariadb";'

  - it: Mysql.conf uses mariadbHost as $server when set
    template: bebot/bot-conf-secret.yaml
    set:
      bebot.instances:
        - name: mybot
          enabled: true
          guildId: 0
          mariadbUser: botuser
          mariadbDatabase: botdb
          mariadbHost: external-mysql.example.com
          ao_username: ao_account
          bot_name: BotCharacter
          dimension: "5"
          raidbot: false
          botOwner: OwnerCharacter
          superAdmins: []
          createSecret: true
    asserts:
      - matchRegex:
          path: stringData["Mysql.conf"]
          pattern: '\$server = "external-mysql\.example\.com";'

  - it: Mysql.conf omits $port/$ssl/$ssl_ca when unset
    template: bebot/bot-conf-secret.yaml
    asserts:
      - notMatchRegex:
          path: stringData["Mysql.conf"]
          pattern: '\$port'
      - notMatchRegex:
          path: stringData["Mysql.conf"]
          pattern: '\$ssl'

  - it: Mysql.conf sets $port/$ssl/$ssl_ca when configured
    template: bebot/bot-conf-secret.yaml
    set:
      bebot.instances:
        - name: mybot
          enabled: true
          guildId: 0
          mariadbUser: botuser
          mariadbDatabase: botdb
          mariadbHost: external-mysql.example.com
          mariadbPort: 25060
          mariadbSsl: true
          mariadbSslCa: /etc/bebot/certs/ca.pem
          ao_username: ao_account
          bot_name: BotCharacter
          dimension: "5"
          raidbot: false
          botOwner: OwnerCharacter
          superAdmins: []
          createSecret: true
    asserts:
      - matchRegex:
          path: stringData["Mysql.conf"]
          pattern: '\$port = 25060;'
      - matchRegex:
          path: stringData["Mysql.conf"]
          pattern: '\$ssl = true;'
      - matchRegex:
          path: stringData["Mysql.conf"]
          pattern: '\$ssl_ca = "/etc/bebot/certs/ca\.pem";'

  - it: renders log/logPath/logTimestamp/logFormat values from the instance into Bot.conf
    template: bebot/bot-conf-secret.yaml
    set:
      bebot.instances:
        - name: mybot
          enabled: true
          guildId: 0
          mariadbUser: botuser
          mariadbDatabase: botdb
          ao_username: ao_account
          bot_name: BotCharacter
          dimension: "5"
          raidbot: false
          botOwner: OwnerCharacter
          superAdmins: []
          log: all
          logPath: /custom/log/path
          logTimestamp: date
          logConsoleFormat: json
          logFileFormat: json
          logSecurityFormat: json
          createSecret: true
    asserts:
      - matchRegex:
          path: stringData["Bot.conf"]
          pattern: '\$log = "all";'
      - matchRegex:
          path: stringData["Bot.conf"]
          pattern: '\$log_path = "/custom/log/path";'
      - matchRegex:
          path: stringData["Bot.conf"]
          pattern: '\$log_timestamp = "date";'
      - matchRegex:
          path: stringData["Bot.conf"]
          pattern: '\$log_console_format = "json";'
      - matchRegex:
          path: stringData["Bot.conf"]
          pattern: '\$log_file_format = "json";'
      - matchRegex:
          path: stringData["Bot.conf"]
          pattern: '\$log_security_format = "json";'

  - it: renders one bot config Secret per instance
    template: bebot/bot-conf-secret.yaml
    set:
      bebot.instances:
        - name: bot1
          enabled: true
          guildId: 1
          mariadbUser: user1
          mariadbDatabase: db1
          ao_username: acct1
          bot_name: Bot1
          dimension: "5"
          raidbot: false
          botOwner: Owner1
          superAdmins: []
          createSecret: true
        - name: bot2
          enabled: true
          guildId: 2
          mariadbUser: user2
          mariadbDatabase: db2
          ao_username: acct2
          bot_name: Bot2
          dimension: "5"
          raidbot: false
          botOwner: Owner2
          superAdmins: []
          createSecret: true
    asserts:
      - hasDocuments:
          count: 2

  - it: renders a mariadb-root Secret when mariadb is enabled
    template: mariadb/mariadb-root-secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mariadb-root

  - it: does not render mariadb-root Secret when mariadb is disabled
    template: mariadb/mariadb-root-secret.yaml
    set:
      bebot.mariadb.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render mariadb-root Secret when createSecret is false
    template: mariadb/mariadb-root-secret.yaml
    set:
      bebot.mariadb.createSecret: false
    asserts:
      - hasDocuments:
          count: 0

  - it: always writes root-user as "root" regardless of bebot.mariadb.rootUser
    template: mariadb/mariadb-root-secret.yaml
    set:
      bebot.mariadb.rootUser: admin
    asserts:
      - equal:
          path: stringData.root-user
          value: "root"
