suite: mariadb network policy
templates:
  - mariadb/mariadb-networkpolicy.yaml
tests:
  - it: renders a NetworkPolicy when mariadb is enabled
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mariadb
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/instance: RELEASE-NAME-mariadb

  - it: renders nothing when mariadb is disabled
    set:
      bebot.mariadb.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: allows ingress from each bot instance
    asserts:
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector:
              matchLabels:
                app: RELEASE-NAME-mybot

  - it: allows ingress from labelled helm test pods
    asserts:
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector:
              matchLabels:
                RELEASE-NAME-mariadb-client: "true"

  - it: only opens the MariaDB port
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 1
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 3306
