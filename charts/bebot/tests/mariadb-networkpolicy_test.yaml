suite: mariadb network policy
templates:
  - mariadb/mariadb-networkpolicy.yaml
tests:
  - it: renders a NetworkPolicy when mariadb is enabled
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mariadb
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/instance: RELEASE-NAME-mariadb

  - it: renders nothing when mariadb is disabled
    set:
      bebot.mariadb.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: allows ingress from each bot instance
    asserts:
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector:
              matchLabels:
                app: RELEASE-NAME-mybot

  - it: does not open ingress to the whole namespace by default
    asserts:
      - notContains:
          path: spec.ingress[0].from
          content:
            podSelector: {}

  - it: opens ingress to the whole namespace when backup is enabled
    set:
      bebot.mariadb.backup.enabled: true
    asserts:
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector: {}

  - it: opens ingress to the whole namespace when restore is enabled
    set:
      bebot.mariadb.backup.enabled: true
      bebot.mariadb.restore.enabled: true
    asserts:
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector: {}

  - it: opens ingress to the whole namespace when bootstrapFrom is enabled
    set:
      bebot.mariadb.backup.enabled: true
      bebot.mariadb.bootstrapFrom.enabled: true
    asserts:
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector: {}

  - it: adds metrics ingress rule when metrics are enabled
    set:
      bebot.mariadb.metrics.enabled: true
    asserts:
      - isNotEmpty:
          path: spec.ingress[1]
