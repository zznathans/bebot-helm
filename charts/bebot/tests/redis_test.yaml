suite: redis CR
templates:
  - redis/redis.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a single Redis CR when enabled
    set:
      bebot.redis.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isAPIVersion:
          of: redis.redis.opstreelabs.in/v1beta2
      - isKind:
          of: Redis
      - equal:
          path: metadata.name
          value: RELEASE-NAME-redis

  - it: uses the configured redis image
    set:
      bebot.redis.enabled: true
      bebot.redis.image: quay.io/opstree/redis:v7.2.5
    asserts:
      - equal:
          path: spec.kubernetesConfig.image
          value: quay.io/opstree/redis:v7.2.5

  - it: uses persistent storage sized from values by default
    set:
      bebot.redis.enabled: true
    asserts:
      - equal:
          path: spec.storage.volumeClaimTemplate.spec.resources.requests.storage
          value: 1Gi

  - it: omits storage entirely when persistence is disabled
    set:
      bebot.redis.enabled: true
      bebot.redis.persistence.enabled: false
    asserts:
      - notExists:
          path: spec.storage

  - it: enables the redis exporter when metrics is configured
    set:
      bebot.redis.enabled: true
      bebot.redis.metrics.enabled: true
    asserts:
      - equal:
          path: spec.redisExporter.enabled
          value: true

  - it: does not enable the redis exporter by default
    set:
      bebot.redis.enabled: true
    asserts:
      - notExists:
          path: spec.redisExporter
